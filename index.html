<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSiteofPhoto | Your Personal Photo Cloud</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; scroll-behavior: smooth; }
        .hero-gradient {
            background: linear-gradient(rgba(17, 24, 39, 0.7), rgba(17, 24, 39, 0.9)), url('https://images.unsplash.com/photo-1493246507139-91e8bef99c02?auto=format&fit=crop&q=80&w=1920');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100">

    <!-- Navigation -->
    <nav class="flex items-center justify-between px-8 py-6 max-w-7xl mx-auto">
        <div class="text-2xl font-bold tracking-tighter flex items-center gap-2">
            <i class="fas fa-camera-retro text-blue-500"></i>
            <span>WebSiteofPhoto</span>
        </div>
        <div class="hidden md:flex space-x-8 text-sm font-medium">
            <a href="#gallery" class="hover:text-blue-400 transition">Gallery</a>
            <a href="https://github.com/lowenghup/WebSiteofPhoto" class="hover:text-blue-400 transition">GitHub</a>
        </div>
        <!-- Upload Trigger Button (Top Nav) -->
        <label for="file-upload" class="cursor-pointer bg-blue-600 hover:bg-blue-700 px-5 py-2 rounded-full text-sm font-semibold transition">
            <i class="fas fa-upload mr-2"></i> Upload Photo
        </label>
    </nav>

    <!-- Hero Section -->
    <header class="hero-gradient h-[60vh] flex items-center justify-center text-center px-4">
        <div class="max-w-3xl">
            <h1 class="text-5xl md:text-7xl font-bold mb-6 tracking-tight">Your memories, <span class="text-blue-500">privately</span> hosted.</h1>
            
            <!-- Hidden File Input -->
            <input type="file" id="file-upload" class="hidden" accept="image/*" multiple onchange="previewImages(event)">
            
            <div class="flex flex-col md:flex-row gap-4 justify-center">
                <label for="file-upload" class="cursor-pointer bg-white text-black px-8 py-4 rounded-xl font-bold hover:bg-gray-200 transition flex items-center justify-center">
                    <i class="fas fa-cloud-upload-alt mr-2 text-xl"></i> Start Uploading
                </label>
                <a href="#gallery" class="bg-transparent border border-gray-500 px-8 py-4 rounded-xl font-bold hover:bg-white/10 transition">
                    View Gallery
                </a>
            </div>
            <p class="mt-4 text-gray-400 text-sm italic">Note: In this demo, uploads stay in your browser until you refresh.</p>
        </div>
    </header>

    <!-- Gallery Section -->
    <section id="gallery" class="py-20 px-8 max-w-7xl mx-auto">
        <div class="flex justify-between items-end mb-12">
            <div>
                <h2 class="text-3xl font-bold mb-2">Photo Gallery</h2>
                <div class="h-1 w-20 bg-blue-500"></div>
            </div>
            <span id="photo-count" class="text-gray-400 text-sm">0 Photos</span>
        </div>

        <!-- Empty State Message -->
        <div id="empty-state" class="text-center py-20 border-2 border-dashed border-gray-700 rounded-3xl">
            <i class="fas fa-images text-5xl text-gray-700 mb-4"></i>
            <p class="text-gray-500">No photos uploaded yet. Click upload to begin!</p>
        </div>

        <!-- Image Grid -->
        <div id="image-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Uploaded photos will appear here -->
        </div>
    </section>

    <!-- Footer -->
    <footer class="py-12 border-t border-gray-800 text-center">
        <p class="text-gray-500 text-sm">
            &copy; 2024 WebSiteofPhoto | Hosted on GitHub Pages
        </p>
    </footer>

    <!-- JavaScript to handle the "Upload" simulation -->
    <script>
        let photoCount = 0;

        function previewImages(event) {
            const files = event.target.files;
            const grid = document.getElementById('image-grid');
            const emptyState = document.getElementById('empty-state');
            const countDisplay = document.getElementById('photo-count');

            if (files.length > 0) {
                emptyState.classList.add('hidden');
            }

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                const reader = new FileReader();

                reader.onload = function(e) {
                    // Create Gallery Item
                    const div = document.createElement('div');
                    div.className = "group relative aspect-square overflow-hidden rounded-xl bg-gray-800 border border-gray-700";
                    
                    div.innerHTML = `
                        <img src="${e.target.result}" class="object-cover w-full h-full transform group-hover:scale-110 transition duration-500">
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                            <button class="text-white bg-red-600 p-2 rounded-full hover:bg-red-700" onclick="this.parentElement.parentElement.remove(); checkEmpty();">
                                <i class="fas fa-trash"></i>
                            </button>
                        </div>
                    `;
                    
                    grid.appendChild(div);
                    photoCount++;
                    countDisplay.innerText = `${photoCount} Photos`;
                }

                reader.readAsDataURL(file);
            }
        }

        function checkEmpty() {
            const grid = document.getElementById('image-grid');
            const emptyState = document.getElementById('empty-state');
            const countDisplay = document.getElementById('photo-count');
            
            photoCount--;
            countDisplay.innerText = `${photoCount} Photos`;

            if (grid.children.length === 0) {
                emptyState.classList.remove('hidden');
                photoCount = 0;
                countDisplay.innerText = `0 Photos`;
            }
        }
    </script>
</body>
</html>
